# Closed-Loop Experiment Configuration
# E6: Closed-loop pointing performance vs estimator degradation

simulation:
  duration: 200.0
  dt: 0.01
  seed: 42

spacecraft:
  inertia:
    - [100.0, 0.0, 0.0]
    - [0.0, 80.0, 0.0]
    - [0.0, 0.0, 60.0]
  initial_attitude: [0.5, 0.0, 0.0, 0.8660254]  # 60 deg about x
  initial_omega: [0.1, 0.0, 0.0]
  disturbance_torque: [0.0, 0.0, 0.0]

gyroscope:
  sigma_v: 1.0e-4
  sigma_u: 1.0e-6
  sigma_b0: 1.0e-3
  rate: 100.0
  initial_bias: [0.001, -0.002, 0.0005]

star_tracker:
  sigma_theta: 4.848e-5  # 10 arcsec
  rate: 1.0
  outlier_prob: 0.0
  outage_prob: 0.0

filter:
  variant: "gyro_driven"
  P0_attitude: 1.0e-4
  P0_bias: 1.0e-6
  Q_scale: 1.0
  R_scale: 1.0

controller:
  K_q: 2.0
  K_omega: 20.0
  max_torque: 0.1
  control_type: "quaternion_feedback"

reaction_wheels:
  max_torque: 0.1
  max_momentum: 10.0
  num_wheels: 3

analysis:
  monte_carlo_runs: 50
  nees_confidence: 0.95
  nis_confidence: 0.95

# Experiment-specific parameters (override in command line)
# Q_scale: 10.0  # Degraded estimator
# R_scale: 10.0  # Degraded estimator
# inertia_mismatch: 0.2  # 20% inertia error