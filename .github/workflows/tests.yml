name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Run regression and integration suite
        run: python -m pytest
      - name: Verify the package installs and imports outside the checkout
        run: |
          python -m pip install . --no-deps --target "$RUNNER_TEMP/pkg"
          cd "$RUNNER_TEMP"
          PYTHONPATH="$RUNNER_TEMP/pkg" python -c "import src.estimation.mekf, src.control.attitude_controller"
      - name: Smoke-test the simulation entry point
        run: |
          python - <<'EOF'
          from dataclasses import replace
          from scripts.run_experiment import load_config, run_simulation, compute_performance_metrics
          config = replace(load_config("config/closed_loop.yaml"), duration=5.0)
          metrics = compute_performance_metrics(run_simulation(config))
          assert metrics["peak_commanded_torque_nm"] <= 0.1 + 1e-12
          print("simulation smoke test OK")
          EOF
